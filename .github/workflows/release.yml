name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RAW_VER="${{ inputs.version }}"
          else
            RAW_VER="${{ github.ref_name }}"
          fi
          VER="${RAW_VER#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version: $VER"

      - name: Build macOS unsigned flat package
        run: |
          make macos-pkg VERSION="${{ steps.version.outputs.version }}"

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 EdgeDisco-*.pkg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload package assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/EdgeDisco-*.pkg
            dist/SHA256SUMS.txt

      - name: Upload artifact for manual workflow runs
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: EdgeDisco-${{ steps.version.outputs.version }}-macos-pkg
          path: |
            dist/EdgeDisco-*.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
