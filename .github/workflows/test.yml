name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust verification
        run: make check
      - name: Rust release build
        run: make build-rust

  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging test runner
        run: python -m pip install pytest
      - name: Verify native macOS package pipeline
        run: make macos-package-check

  # The Python implementation is compatibility coverage during the port. It
  # must never be part of the normal Rust push/PR gate.
  legacy-python:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Test legacy Python implementation
        run: python -m unittest discover -s tests -v
      - name: Compile legacy Python implementation
        run: python -m compileall -q src tests

  legacy-python-integrations:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP and OTLP extras
        run: python -m pip install '.[mcp,otlp]'
      - name: Test legacy Python integrations
        run: python -m unittest tests.test_mcp_server tests.test_otlp_encoder tests.test_otlp_exporter tests.test_inventory_lifecycle -v
