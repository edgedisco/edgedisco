name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Test
        # Run against the installed package (src/ layout is not on PYTHONPATH).
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests

  optional-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP and OTLP extras
        run: python -m pip install '.[mcp,otlp]'
      - name: Test MCP protocol and OTLP protobuf paths
        run: python -m unittest tests.test_mcp_server tests.test_otlp_encoder tests.test_otlp_exporter tests.test_inventory_lifecycle tests.test_privacy_invariants tests.test_otlp_fixtures -v
