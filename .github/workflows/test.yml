name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Rust verification
        run: make check
      - name: Rust release build
        run: make build-rust

  macos-package:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Swift packages
        run: make swift-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging test runner
        run: python -m pip install pytest
      - name: Verify native macOS package pipeline
        run: make macos-package-check
