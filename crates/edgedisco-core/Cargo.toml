[package]
name = "edgedisco-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1.16", features = ["v4"] }
regex = "1.11"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.27"
