[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-asset-inventory"
version = "0.5.0"
description = "Privacy-preserving endpoint inventory for local AI applications and agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Neeraj Sabharwal"}]
dependencies = []
urls = {Homepage = "https://github.com/edgedisco/edgedisco", Repository = "https://github.com/edgedisco/edgedisco", Issues = "https://github.com/edgedisco/edgedisco/issues"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security"
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3; python_version >= '3.10'"]
otlp = ["opentelemetry-proto==1.39.1", "protobuf==6.33.6"]

[project.scripts]
ai-inventory = "ai_asset_inventory.cli:main"
edgedisco = "ai_asset_inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_asset_inventory = ["dashboard.html", "fingerprints.json"]
